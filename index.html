<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amit Sharma & Priya Mehta | Royal Wedding Invitation</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">

  <style>
    :root {
      --royal-maroon: #5A121C;
      --deep-maroon: #3E0B12;
      --deep-emerald: #0C3836;
      --peacock-teal: #145956;
      --antique-gold: #B6862C;
      --bright-gold: #D4AF37;
      --soft-gold: #E6C762;
      --parchment-cream: #FBF6EC;
      --warm-sand: #F2E6D0;
      --dark-ink: #231712;
      --text-muted: #5C4738;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--parchment-cream);
      background-image: radial-gradient(rgba(182, 134, 44, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--dark-ink);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
      line-height: 1.5;
    }

    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-serif-luxury { font-family: 'Cormorant Garamond', serif; }
    .font-script { font-family: 'Great Vibes', cursive; }
    .font-sanskrit { font-family: 'Tiro Devanagari Sanskrit', serif; }
    .font-sans { font-family: 'Montserrat', sans-serif; }

    /* Ornamental Divider SVG Styling */
    .ornament-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0.85rem auto;
      width: 100%;
      max-width: 240px;
    }

    .ornament-divider svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    /* =================================================
       1. INTRO SCREEN (CLEAN VIDEO + SMALL BOTTOM TEXT)
       ================================================= */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #091312;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.95s ease, visibility 0.95s ease;
      overflow: hidden;
    }

    #intro-screen.hidden-intro {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .tap-to-enter-prompt {
      position: relative;
      z-index: 2;
      margin-bottom: 2.4rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 250, 240, 0.92);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      padding: 0.4rem 1rem;
      animation: gentlePulse 2.2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes gentlePulse {
      0%, 100% { opacity: 0.55; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* =================================================
       FLOATING MUSIC BUTTON (BOTTOM RIGHT)
       ================================================= */
    .floating-controls {
      position: fixed;
      bottom: 22px;
      right: 18px;
      z-index: 950;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .music-fab {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #F2D57E, #B6862C 70%, #8C6218 100%);
      border: 2px solid #FFF6D6;
      color: var(--deep-maroon);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(35, 23, 18, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .music-fab:hover {
      transform: scale(1.06);
    }

    .music-fab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* =================================================
       ARTWORK STAGE WRAPPER (FOR SECTION 2 & SECTION 3)
       ================================================= */
    .artwork-section-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--parchment-cream);
    }

    .artwork-stage {
      position: relative;
      width: 100%;
      max-width: 620px;
      aspect-ratio: 682 / 1024;
      background-size: 100% 100%;
      background-position: center center;
      background-repeat: no-repeat;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(90, 18, 28, 0.14);
    }

    /* =================================================
       2. HERO SECTION (1st Peacock & Mandala Image)
       ================================================= */
    #hero-stage {
      /* Save your 1st uploaded peacock & mandala image as 'hero-bg.jpg' */
      background-image: url('hero-bg.jpg');
      background-color: #F7EFE0;
    }

    .hero-blank-zone {
      position: absolute;
      top: 22.5%;
      bottom: 43.5%;
      left: 10%;
      right: 10%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 4;
    }

    .hero-shloka {
      font-size: clamp(0.88rem, 2.2vw, 1.1rem);
      color: var(--antique-gold);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
    }

    .hero-subline {
      font-size: clamp(0.82rem, 2vw, 1.02rem);
      color: var(--dark-ink);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .hero-names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.35rem, 6.8vw, 3.7rem);
      color: var(--royal-maroon);
      line-height: 1.04;
      margin: 0.1rem 0;
    }

    .hero-amp {
      font-family: 'Great Vibes', cursive;
      font-size: 0.72em;
      color: var(--royal-maroon);
      display: block;
      margin: 0.05rem 0;
    }

    .hero-date {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.88rem, 2.4vw, 1.18rem);
      font-weight: 700;
      color: #4A3219;
      letter-spacing: 1.5px;
      margin-top: 0.2rem;
    }

    .hero-venue {
      font-size: clamp(0.84rem, 2.1vw, 1.05rem);
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.25;
      margin-top: 0.15rem;
    }

    /* =================================================
       3. PARIVAR & AASHIRWAD (2nd Arch & Chandelier Image)
       ================================================= */
    #parivar-stage {
      /* Save your uploaded floral arch & chandelier image as 'parivar-bg.jpg' */
      background-image: url('parivar-bg.jpg');
      background-color: #F3E5D0;
    }

    /* Positioned strictly inside the blank arch space below the chandelier and between the two pillars */
    .parivar-blank-zone {
      position: absolute;
      top: 37.5%;
      bottom: 13.5%;
      left: 21%;
      right: 21%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 4;
    }

    .ganesh-emblem {
      width: clamp(34px, 7.5vw, 48px);
      height: auto;
      margin-bottom: 0.15rem;
      filter: drop-shadow(0 2px 4px rgba(90, 18, 28, 0.2));
    }

    .parivar-shloka {
      font-size: clamp(0.76rem, 2vw, 0.98rem);
      color: var(--royal-maroon);
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .parivar-invite-text {
      font-size: clamp(0.75rem, 1.95vw, 0.98rem);
      color: #3D261A;
      line-height: 1.28;
      margin: 0.15rem 0 0.25rem;
      font-weight: 600;
    }

    .parivar-couple-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.75rem, 5.2vw, 2.55rem);
      color: var(--royal-maroon);
      line-height: 1.05;
      margin: 0.08rem 0;
    }

    .parivar-parent-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.5rem, 1.25vw, 0.66rem);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--peacock-teal);
      font-weight: 700;
      margin-top: 0.1rem;
    }

    .parivar-parent-names {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.58rem, 1.45vw, 0.76rem);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--dark-ink);
      font-weight: 700;
      margin-bottom: 0.15rem;
    }

    .parivar-with {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.25rem, 3.5vw, 1.7rem);
      color: var(--antique-gold);
      line-height: 1;
      margin: 0.1rem 0;
    }

    .parivar-footer-date {
      font-size: clamp(0.78rem, 2vw, 1.02rem);
      font-weight: 700;
      color: var(--royal-maroon);
      margin-top: 0.15rem;
    }

    .parivar-footer-venue {
      font-size: clamp(0.68rem, 1.75vw, 0.88rem);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* =================================================
       COMMON INNER CONTAINER FOR SECTIONS 4 TO 8
       ================================================= */
    .royal-section {
      max-width: 620px;
      margin: 0 auto;
      padding: 4rem 1.35rem;
      text-align: center;
      position: relative;
    }

    .script-heading {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.7rem, 7.5vw, 3.8rem);
      color: var(--royal-maroon);
      font-weight: 400;
      line-height: 1.1;
    }

    /* =================================================
       4. OUR FAMILIES / BLESSINGS SECTION
       ================================================= */
    .blessings-quote {
      font-style: italic;
      font-size: clamp(1.08rem, 2.8vw, 1.3rem);
      color: var(--text-muted);
      max-width: 440px;
      margin: 0.8rem auto 2rem;
      line-height: 1.45;
    }

    .blessings-frame {
      background: linear-gradient(180deg, #FFFDF9 0%, #F7EFE0 100%);
      border: 1.5px solid var(--antique-gold);
      border-radius: 18px;
      padding: 2.5rem 1.5rem;
      box-shadow: 0 12px 35px rgba(182, 134, 44, 0.14);
      position: relative;
    }

    .blessings-subhead {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: var(--peacock-teal);
      font-weight: 700;
      margin-bottom: 1.2rem;
    }

    .family-member-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .family-member-list li {
      font-size: clamp(1.25rem, 3.5vw, 1.5rem);
      font-weight: 600;
      color: var(--royal-maroon);
      letter-spacing: 0.4px;
    }

    /* =================================================
       5. COUNTDOWN & 6. LOCATION SECTION
       ================================================= */
    .countdown-location-wrapper {
      background: linear-gradient(180deg, #F6EBD8 0%, var(--parchment-cream) 100%);
      border-top: 1px solid rgba(182, 134, 44, 0.3);
      border-bottom: 1px solid rgba(182, 134, 44, 0.3);
    }

    .countdown-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(0.6rem, 3vw, 1.5rem);
      margin: 1.6rem 0 1.2rem;
    }

    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 58px;
    }

    .cd-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 7vw, 3.5rem);
      font-weight: 600;
      color: var(--royal-maroon);
      line-height: 1;
    }

    .cd-label {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    .cd-colon {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--antique-gold);
      line-height: 1;
      padding-top: 0.2rem;
      font-weight: 700;
    }

    .until-text {
      font-style: italic;
      font-size: clamp(1.05rem, 2.8vw, 1.28rem);
      color: var(--text-muted);
      margin-bottom: 3.2rem;
    }

    .location-city {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--peacock-teal);
      font-weight: 700;
      margin-top: 1rem;
    }

    .location-palace {
      font-size: clamp(1.6rem, 4.5vw, 2.1rem);
      font-weight: 700;
      color: var(--royal-maroon);
      margin: 0.45rem 0 0.25rem;
    }

    .location-address {
      font-size: 1.12rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .map-link-btn {
      display: inline-block;
      margin-top: 1.1rem;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--royal-maroon);
      border-bottom: 1.5px solid var(--antique-gold);
      padding-bottom: 3px;
      text-decoration: none;
      font-weight: 700;
    }

    .palace-illustration {
      width: 100%;
      max-width: 440px;
      margin: 2rem auto 0;
      display: block;
    }

    /* =================================================
       7. TIMELINE SECTION (AS UPLOADED IMAGE WA0007)
       ================================================= */
    .timeline-stage {
      position: relative;
      max-width: 580px;
      margin: 2rem auto 0;
      padding: 1rem 0;
    }

    /* Central Vertical Gold Line */
    .timeline-stage::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      background: linear-gradient(180deg, transparent 0%, var(--antique-gold) 8%, var(--antique-gold) 92%, transparent 100%);
      transform: translateX(-50%);
    }

    .tl-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      position: relative;
      margin-bottom: 3.4rem;
    }

    .tl-row:last-child {
      margin-bottom: 0;
    }

    /* Center Diamond Node */
    .tl-diamond {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      width: 14px;
      height: 14px;
      background: var(--parchment-cream);
      border: 2px solid var(--antique-gold);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tl-diamond::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--royal-maroon);
    }

    .tl-col-left {
      padding-right: 1.6rem;
      text-align: right;
    }

    .tl-col-right {
      padding-left: 1.6rem;
      text-align: left;
    }

    .tl-art-box {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tl-art-box svg {
      width: 100%;
      max-width: 155px;
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(90, 18, 28, 0.12));
    }

    .tl-date {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.62rem, 1.8vw, 0.76rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--peacock-teal);
      font-weight: 700;
      margin-bottom: 0.15rem;
    }

    .tl-script-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.1rem, 6vw, 2.85rem);
      color: var(--royal-maroon);
      line-height: 1.05;
      margin-bottom: 0.15rem;
    }

    .tl-title-en {
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-weight: 700;
      color: var(--dark-ink);
      line-height: 1.15;
    }

    .tl-title-hi {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: clamp(0.95rem, 2.6vw, 1.12rem);
      color: var(--antique-gold);
      margin-bottom: 0.45rem;
    }

    .tl-venue {
      font-style: italic;
      font-size: clamp(0.9rem, 2.4vw, 1.05rem);
      color: var(--text-muted);
      margin-bottom: 0.55rem;
    }

    .tl-rsvp-link {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--royal-maroon);
      text-decoration: none;
      border-bottom: 1.5px solid var(--antique-gold);
      padding-bottom: 2px;
    }

    /* =================================================
       8. RSVP SECTION
       ================================================= */
    .rsvp-box {
      background: linear-gradient(180deg, #FFFDF9 0%, #F7EFE0 100%);
      border: 1.5px solid var(--antique-gold);
      border-radius: 18px;
      padding: 2.2rem 1.5rem;
      box-shadow: 0 12px 35px rgba(182, 134, 44, 0.14);
      text-align: left;
      margin-top: 1.5rem;
    }

    .form-field {
      margin-bottom: 1.15rem;
    }

    .form-field label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.74rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--royal-maroon);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.78rem 0.95rem;
      border: 1px solid rgba(182, 134, 44, 0.55);
      border-radius: 8px;
      background: var(--parchment-cream);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--dark-ink);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--royal-maroon);
    }

    .btn-submit-rsvp {
      width: 100%;
      padding: 0.9rem 1.5rem;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #FFFDF9;
      background: linear-gradient(135deg, var(--royal-maroon) 0%, var(--deep-maroon) 100%);
      border: 1px solid var(--bright-gold);
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .btn-submit-rsvp:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- =================================================
       BACKGROUND AUDIO (STARTS ON INTRO SCREEN TAP)
       ================================================= -->
  <!-- Save your royal wedding instrumental audio as 'wedding-music.mp3' -->
  <audio id="bg-music" loop preload="auto">
    <source src="wedding-music.mp3" type="audio/mpeg" />
  </audio>

  <!-- Floating Music Play/Pause Button -->
  <div class="floating-controls">
    <button class="music-fab" id="music-toggle-btn" aria-label="Toggle Background Music">
      <!-- Pause Icon (shown when music is playing) -->
      <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
      <!-- Play Icon (shown initially) -->
      <svg id="icon-play" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
  </div>

  <!-- =================================================
       1. INTRO SCREEN (NO OVERLAY TEXT EXCEPT BOTTOM PROMPT)
       ================================================= -->
  <div id="intro-screen">
    <!-- Save your intro video as 'intro-video.mp4' -->
    <video id="intro-video" muted playsinline preload="auto">
  <source src="intro-video.mp4" type="video/mp4" />
    </video>

    <div class="tap-to-enter-prompt">
      Tap on screen to enter celebration
    </div>
  </div>

  <!-- =================================================
       2. HERO SECTION (1st Uploaded Peacock & Mandala Image)
       ================================================= -->
  <section class="artwork-section-wrapper">
    <div class="artwork-stage" id="hero-stage">
      <div class="hero-blank-zone">
